name: Build and Deploy

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout

    - name: Setup Node
      uses: actions/setup-node
      with:
        node-version: 24
      
    - name: Install dependencies
      run: npm install

    - name: Generate
      run: node generate.js

